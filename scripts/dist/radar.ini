[radar]
; 全机雷达配置样例 —— scout.exe --radar --radar-config radar.ini
; 修改本文件自动热生效（每拍检查 mtime），无需重启 scout
; 数字项 <=0 或留空 = 保持当前值；exclude 留空 = 清空排除表

; 冻结判定阈值（毫秒）：窗口消息无响应超过该时长即告警
thresholdMs=2000

; 探测轮询间隔（毫秒）
intervalMs=500

; CPU 忙转阈值（单核百分比）
cpuThreshold=95

; CPU 连续超阈值拍数（迟滞防抖：连续 N 拍超阈值才发一条告警）
cpuRuns=3

; 排除表：进程名子串，逗号分隔，大小写不敏感
exclude=RtkUWP
