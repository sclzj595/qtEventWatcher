# V4 A2 CI 回归工作流
# 定位：CI 兜底【编译 + 冒烟】——不跑 benchmark（共享 runner 噪声大，基线漂移检测
# 只在本地 scripts/run_regression.ps1 做，见 docs/25 §3 A1）。
# spdlog 为源码树内分发（third_party/spdlog-1.x），checkout 即有，无需安装。
#
# 矩阵说明：CI 只放 MSVC × 2 稳定组合；MinGW 矩阵（5.15.2/mingw81、6.5.3/mingw1120）
# 因 aqt 工具名随版本漂移，留作注释模板——启用前以 `aqt list-qt windows desktop` 与
# `aqt list-tool windows desktop tools_mingw81` 官方输出核对名称。
# 本地全四矩阵回归以 scripts/run_regression.ps1 为准（qt-matrix.json 驱动）。

name: regression

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: smoke (${{ matrix.name }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: qt5152-msvc
            qtVersion: '5.15.2'
            qtArch: win64_msvc2019_64
          - name: qt653-msvc
            qtVersion: '6.5.3'
            qtArch: win64_msvc2019_64
        # MinGW 模板（名称待 aqt 官方 list 核对后启用）：
        # - name: qt5152-mingw
        #   qtVersion: '5.15.2'
        #   qtArch: win64_mingw81
        #   toolVariant: tools_mingw81          # aqt install-tool 目录名
        #   toolPackage: qt.tools.win64_mingw810

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt (${{ matrix.qtVersion }})
        shell: pwsh
        run: |
          pip install aqtinstall
          aqt install-qt windows desktop ${{ matrix.qtVersion }} ${{ matrix.qtArch }} --outputdir D:\Qt
          # Qt 6.5.x + 新版 MSVC STL（VS2022 17.13+）兼容补丁：
          # qcompilerdetection.h 将 QT_MAKE_CHECKED/UNCHECKED_ARRAY_ITERATOR
          # 定义为 stdext::make_checked/unchecked_array_iterator，而 stdext 已被
          # 新 STL 移除（CI Run 3 实证 QtCore/qvarlengtharray.h C2065 'stdext'；
          # QTBUG-111580 同源，Qt 官方 6.6+ 已加版本守卫）。checked iterator
          # 仅是调试安全包装，直通替换语义零差异。仅触及安装树，不动仓库。
          if ('${{ matrix.qtVersion }}' -like '6.*') {
            $qcd = "D:\Qt\${{ matrix.qtVersion }}\msvc2019_64\include\QtCore\qcompilerdetection.h"
            if (Test-Path $qcd) {
              $enc = New-Object System.Text.UTF8Encoding($false)
              $c = [IO.File]::ReadAllText($qcd, $enc)
              $c = $c.Replace('stdext::make_unchecked_array_iterator(x)', '(x)')
              $c = $c.Replace('stdext::make_checked_array_iterator(x, size_t(N))', '(x)')
              [IO.File]::WriteAllText($qcd, $c, $enc)
              Write-Host "patched qcompilerdetection.h for Qt ${{ matrix.qtVersion }}"
            }
          }
          # MinGW 矩阵启用时在此追加：
          # aqt install-tool windows desktop ${{ matrix.toolVariant }} ${{ matrix.toolPackage }} --outputdir D:\Qt

      - name: Configure
        shell: pwsh
        run: |
          $qtBin = Get-ChildItem "D:\Qt\${{ matrix.qtVersion }}" -Recurse -Filter Qt${{ matrix.qtVersion }}Core.dll -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $qtBin) {
            # Qt5Core/Qt6Core 命名差异兜底
            $core = if ('${{ matrix.qtVersion }}' -like '5.*') { 'Qt5Core.dll' } else { 'Qt6Core.dll' }
            $qtBin = Get-ChildItem "D:\Qt\${{ matrix.qtVersion }}" -Recurse -Filter $core | Select-Object -First 1
          }
          if (-not $qtBin) { throw "Qt runtime dll not found under D:\Qt\${{ matrix.qtVersion }}" }
          $qtRoot = $qtBin.Directory.Parent.FullName     # ...\msvc2019_64
          "QT_ROOT=$qtRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          cmake -S . -B build-ci -DCMAKE_PREFIX_PATH="$qtRoot"

      - name: Build
        shell: pwsh
        run: |
          # V7：CI 构建取证——输出落盘，失败时把 error 行写入 step summary
          # （公开页匿名可读）与 ::error:: 注解，免去登日志排查
          cmake --build build-ci --config Release --parallel 2>&1 | Tee-Object build.log
          exit $LASTEXITCODE

      - name: Report build errors
        if: failure()
        shell: pwsh
        run: |
          if (-not (Test-Path build.log)) { "::error::build.log missing" | Out-File $env:GITHUB_STEP_SUMMARY -Append; exit 0 }
          $errs = Select-String -Path build.log -Pattern 'error C\d|error LNK|fatal error|error MSB|C1[0-9]{3}|: error' |
            Select-Object -ExpandProperty Line -First 20
          if (-not $errs) {
            $errs = Get-Content build.log -Tail 40
          }
          "### Build errors" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append
          $errs | Out-File $env:GITHUB_STEP_SUMMARY -Append
          '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append
          foreach ($e in $errs) { "::error::$e" }

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.name }}
          path: build.log
          if-no-files-found: ignore

      - name: Smoke
        shell: pwsh
        run: |
          $env:PATH = "$env:QT_ROOT\bin;$env:PATH"
          $exe = Get-ChildItem build-ci -Recurse -Filter TestEventWatcher.exe | Select-Object -First 1
          if (-not $exe) { throw "TestEventWatcher.exe not found" }
          & $exe.FullName 2>&1 | Tee-Object smoke.log
          if ($LASTEXITCODE -ne 0) { throw "smoke exit=$LASTEXITCODE" }
          if (Select-String -Path smoke.log -Pattern 'FAIL' -Quiet) { throw "smoke reported FAIL lines" }

      - name: Upload smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.name }}
          path: smoke.log
          if-no-files-found: ignore

  # ============================================================
  # Linux 编译基线 + 探针 e2e（里程碑 #8：Ubuntu runner 无头验证）
  # libx11-dev：Scout X11 冻结探针；xvfb：Widgets 冒烟与 e2e 验证靶无头跑。
  # Qt 前缀固定 /opt/qt/<ver>/gcc_64（aqt linux 布局确定，无需 Windows 版
  # 的 dll 搜索兜底）。
  # ============================================================
  linux-smoke:
    name: linux-smoke (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: qt5152-gcc
            qtVersion: '5.15.2'
            qtArch: gcc_64
          - name: qt653-gcc
            qtVersion: '6.5.3'
            qtArch: gcc_64

    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          # libgl1-mesa-dev：Qt5Gui 配置期需 gl.h（缺失即 Configure 失败——
          # Run 12 取证真实失败点是 Configure exit 1）+ 运行期 libGL.so.1；
          # xcb 系：平台插件 xcb 的运行依赖（Smoke 于 xvfb 下需加载 xcb 插件）
          sudo apt-get install -y libx11-dev xvfb libgl1-mesa-dev libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libx11-xcb1 libxcb-cursor0

      - name: Install Qt (${{ matrix.qtVersion }})
        run: |
          pip install aqtinstall
          aqt install-qt linux desktop ${{ matrix.qtVersion }} ${{ matrix.qtArch }} --outputdir /opt/qt
          test -d "/opt/qt/${{ matrix.qtVersion }}/${{ matrix.qtArch }}" \
            || { echo "::error::Qt prefix missing under /opt/qt"; exit 1; }

      - name: Configure
        run: |
          set -o pipefail
          cmake -S . -B build-ci -DCMAKE_PREFIX_PATH=/opt/qt/${{ matrix.qtVersion }}/${{ matrix.qtArch }} 2>&1 | tee configure.log

      - name: Report configure errors
        if: failure()
        run: |
          if [ ! -f configure.log ]; then echo "::error::configure.log missing"; exit 0; fi
          # build.log 已存在 = 失败发生在 configure 之后（smoke/e2e），不重复归因
          if [ -f build.log ]; then exit 0; fi
          {
            echo "### Configure errors"
            echo '```'
            grep -i -m 20 'error\|failed' configure.log || tail -40 configure.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -i 'error\|failed' configure.log | head -20 | while read -r l; do echo "::error::$l"; done || true

      - name: Build
        run: |
          set -o pipefail
          cmake --build build-ci --parallel 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          if [ ! -f build.log ]; then echo "::error::build.log missing"; exit 0; fi
          {
            echo "### Build errors"
            echo '```'
            grep -E -m 20 'error:|undefined reference|fatal error|Error [0-9]' build.log || tail -40 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E 'error:|undefined reference|fatal error|Error [0-9]' build.log | head -20 | while read -r l; do echo "::error::$l"; done || true

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.name }}
          path: build.log
          if-no-files-found: ignore

      - name: Smoke (xvfb)
        run: |
          set -o pipefail
          # Qt 随包运行库优先（aqt 包内 lib/ 带 libicu* 等，系统 soname 可能缺代）
          export LD_LIBRARY_PATH="/opt/qt/${{ matrix.qtVersion }}/${{ matrix.qtArch }}/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          # 启动取证：动态库 soname 缺失先写 summary（匿名可读），再进冒烟
          ldd ./build-ci/bin/TestEventWatcher | grep 'not found' > missing_libs.txt || true
          if [ -s missing_libs.txt ]; then
            {
              echo "### Missing shared libs"
              echo '```'
              cat missing_libs.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            while read -r l; do echo "::error::$l"; done < missing_libs.txt
          fi
          # Widgets 集成测试需平台插件显示；xvfb 无头跑（行尾 FAIL 与 exit 码双断言）。
          # 退出码用 || 捕获——bash -e 下管道失败会直接终止，ec=$? 写法永远不执行
          ec=0
          xvfb-run -a ./build-ci/bin/TestEventWatcher 2>&1 | tee smoke.log || ec=$?
          if [ $ec -ne 0 ]; then
            {
              echo "### Smoke failure (exit=$ec)"
              echo '```'
              tail -60 smoke.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            tail -20 smoke.log | while read -r l; do echo "::error::$l"; done || true
            exit $ec
          fi
          if grep -q FAIL smoke.log; then
            {
              echo "### Smoke FAIL lines"
              echo '```'
              grep -m 20 FAIL smoke.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -m 20 FAIL smoke.log | while read -r l; do echo "::error::$l"; done || true
            exit 1
          fi

      - name: Scout e2e - cpu probe (xvfb)
        run: |
          set -o pipefail
          export LD_LIBRARY_PATH="/opt/qt/${{ matrix.qtVersion }}/${{ matrix.qtArch }}/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          # basic_demo 1.5s 后主线程 busy-loop 6s（CPU 单核满转）；timeout 兜底防泄漏
          timeout 8 xvfb-run -a ./build-ci/bin/basic_demo --spin 6000 > basic_demo.log 2>&1 &
          sleep 2
          # scout 挂名采样 10s（3 拍迟滞 × 250ms << 6s 忙转，必命中 cpuSpin）
          # 退出码单独捕获：crash/早退路径也取证（bash -e 下管道失败即终止，
          # 不捕获就只剩裸 exit 1）
          ec=0
          xvfb-run -a ./build-ci/bin/scout --name basic_demo --cpu-threshold 95 --duration 10000 2>&1 | tee scout.log || ec=$?
          if [ $ec -ne 0 ]; then
            {
              echo "### Scout exited $ec (cpu e2e)"
              echo '```'
              tail -40 scout.log
              echo '--- basic_demo.log ---'
              tail -20 basic_demo.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::scout exited $ec before grep assertion"
            exit $ec
          fi
          if ! grep -q 'event=cpuSpin' scout.log; then
            {
              echo "### Scout cpu e2e failure"
              echo '```'
              tail -40 scout.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::scout e2e: cpuSpin line missing"
            exit 1
          fi

      - name: Scout e2e - freeze probe (shared Xvfb)
        run: |
          set -o pipefail
          # basic_demo 与 scout 必须同屏（同一 X server）——分开的 xvfb-run 是两个
          # 独立 X server，_NET_WM_PING 跨 server 不可达。主线程 busy-loop 6s =
          # 消息泵停摆 → freeze started；7.5s 后泵恢复 → recovered（2000 下界口径）
          export LD_LIBRARY_PATH="/opt/qt/${{ matrix.qtVersion }}/${{ matrix.qtArch }}/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          timeout 25 xvfb-run -a bash -c '
            ./build-ci/bin/basic_demo --spin 6000 > basic_demo2.log 2>&1 &
            demo=$!
            sleep 1.5
            ./build-ci/bin/scout --name basic_demo --threshold 2000 --duration 9000 2>&1 | tee scout_freeze.log
            kill $demo 2>/dev/null || true
          ' || ec=$?
          ec=${ec:-0}
          if ! grep -q 'freeze started' scout_freeze.log; then
            {
              echo "### Scout freeze e2e failure (no started line, script-ec=$ec)"
              echo '```'
              tail -40 scout_freeze.log
              echo '--- basic_demo2.log ---'
              tail -20 basic_demo2.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::scout e2e: freeze started line missing"
            exit 1
          fi
          if ! grep -q 'freeze recovered' scout_freeze.log; then
            {
              echo "### Scout freeze e2e failure (no recovered line)"
              echo '```'
              tail -40 scout_freeze.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::scout e2e: freeze recovered line missing"
            exit 1
          fi

      - name: Upload smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.name }}
          path: smoke.log
          if-no-files-found: ignore

      - name: Upload e2e logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.name }}
          path: |
            scout.log
            scout_freeze.log
            basic_demo.log
            basic_demo2.log
          if-no-files-found: ignore
